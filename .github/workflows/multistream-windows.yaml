name: Windows Build (Multistream + Multichat)
run-name: Windows build of ${{ github.ref_name }} 🪟

# Builds a ready-to-run Windows x64 zip of this fork using OBS's own
# build and packaging scripts. Runs on every push to the "multistream"
# branch, or on demand from the Actions tab ("Run workflow").
on:
  push:
    branches:
      - multistream
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 🪟
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: true

      - name: Upload zip 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-multistream-multichat-windows-x64
          path: ${{ github.workspace }}/build_x64/obs-studio-*-windows-x64.zip
          if-no-files-found: error
