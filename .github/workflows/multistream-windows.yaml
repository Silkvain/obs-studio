name: Windows Build (Siegfried)
run-name: Siegfried Windows build 🪟 (${{ github.ref_name }})

# Builds a ready-to-run Windows x64 zip of this fork using OBS's own
# build and packaging scripts. Runs on every push to the "multistream"
# branch, or on demand from the Actions tab ("Run workflow").
on:
  push:
    branches:
      - multistream
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # to publish the installer as a GitHub Release

jobs:
  windows-x64:
    name: Windows x64 🪟
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch version tags 🏷️
        # Forks don't copy upstream tags, but OBS derives its version from
        # `git describe`, so pull the release tags from the official repo.
        run: |
          git fetch --force https://github.com/obsproject/obs-studio.git "refs/tags/*:refs/tags/*"
          # Our own release tags (siegfried-build-N) aren't version numbers;
          # drop them locally so `git describe` finds the OBS release tag.
          git tag -l '*-build-*' | ForEach-Object { git tag -d $_ } | Out-Null

      - name: Build OBS Studio 🧱
        uses: ./.github/actions/build-obs
        env:
          # Built-in chat logins (see frontend/cmake/ui-multichat.cmake)
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package OBS Studio 📀
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: true

      - name: Build installer 📦
        run: |
          $zip = Get-ChildItem build_x64 -Filter 'obs-studio-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Packaged zip not found' }
          $version = $zip.BaseName -replace '^obs-studio-', '' -replace '-windows-x64$', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          New-Item -ItemType Directory -Force dist | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath staging -Force

          # Microsoft Visual C++ runtime, bundled so the installer works on a fresh PC
          Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile vc_redist.x64.exe

          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          & $makensis /V2 `
            "/DAPPVERSION=$version" `
            "/DSRCDIR=$PWD\staging" `
            "/DVCREDIST=$PWD\vc_redist.x64.exe" `
            "/DREPOROOT=$PWD" `
            "/DOUTFILE=$PWD\dist\Siegfried-Setup-$version.exe" `
            .github\installer\siegfried.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }

          # Portable version: one plain zip (no zip-inside-a-zip)
          Copy-Item $zip.FullName "dist\Siegfried-Portable-$version.zip"
          Get-ChildItem dist

      - name: Publish release 🚀
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "siegfried-build-${{ github.run_number }}"
          $notes = @"
          **Install:** download ``Siegfried-Setup-$env:VERSION.exe`` and run it. Siegfried is a fork of OBS Studio with native multistreaming and multichat. It installs alongside regular OBS (separate folder, same settings) and adds Start Menu and desktop shortcuts.

          **Portable:** or unzip ``Siegfried-Portable-$env:VERSION.zip`` anywhere and run ``bin\64bit\obs64.exe``.

          The build isn't code-signed, so Windows SmartScreen may warn on first run: *More info → Run anyway*.

          Built from ${{ github.sha }}.
          "@
          gh release create $tag (Get-ChildItem dist).FullName `
            --target ${{ github.sha }} `
            --title "Siegfried $env:VERSION (build ${{ github.run_number }})" `
            --notes $notes `
            --latest
